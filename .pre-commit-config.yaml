# pre-commit install instala os dois tipos de hook: os de ficheiros (pre-commit) e o da mensagem
# (commit-msg). Os hooks sem "stages" correm so no pre-commit (default_stages), nao outra vez na mensagem.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # detect-secrets 1.5.0 abre os ficheiros com open() sem encoding: no Windows (cp1252)
  # um ficheiro UTF-8 com certos caracteres (ex.: "Á" = bytes C3 81) da UnicodeDecodeError
  # e e SALTADO sem aviso, como se fosse binario. Corre-se em modo UTF-8 (-X utf8), igual
  # ao Linux do CI. Mesmo id: o CI chama `pre-commit run detect-secrets`.
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        language: python
        additional_dependencies: ['detect-secrets==1.5.0']
        entry: python -X utf8 -m detect_secrets.pre_commit_hook
        args: ['--baseline', '.secrets.baseline']

  # lint igual ao do CI (.github/workflows/ci.yml): mesma versao, mesmo ruff.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: denylist
        name: nomes de clientes
        entry: python scripts/check_denylist.py
        language: system
        pass_filenames: true

      # a mensagem do commit tambem fica no historico: um nome de cliente numa mensagem passou uma vez
      # (25.09.2026), porque o hook de cima so le ficheiros
      - id: denylist-mensagem
        name: nomes de clientes na mensagem do commit
        entry: python scripts/check_denylist.py
        language: system
        stages: [commit-msg]

      # teste golden do adaptador Excel (plano 1.5; metodologia-core seccao 15):
      # so corre quando o commit toca no adaptador, na fixture ou no proprio teste.
      # Sem LibreOffice sai com 2 e bloqueia o commit -- instalar, nunca --no-verify.
      - id: golden
        name: golden do adaptador Excel
        entry: python scripts/golden_check.py
        language: system
        pass_filenames: false
        files: ^(adapters/|tests/golden/|docs/tecnica-excel\.md$|scripts/golden_check\.py$)

      # testes unitarios: rapidos, sem LibreOffice. Correm tambem quando mudam os ficheiros
      # que os testes leem: skills e CLAUDE.md (test_skills), demo (test_validar_projeto,
      # test_painel), template do projeto.yaml e esta configuracao (test_guards); motor qa-audit (src/,
      # pyproject.toml, .gitignore e LICENSE: tests/unit/test_engine_guards.py)
      - id: testes
        name: testes unitarios
        entry: python -m unittest discover -s tests
        language: system
        pass_filenames: false
        files: ^(adapters/|scripts/|src/|tests/|examples/|\.claude/skills/|CLAUDE\.md$|docs/projeto\.yaml$|docs/workspace/|\.pre-commit-config\.yaml$|pyproject\.toml$|\.gitignore$|LICENSE$)
