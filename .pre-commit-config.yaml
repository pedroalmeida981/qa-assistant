repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # lint igual ao do CI (.github/workflows/ci.yml): mesma versao, mesmo ruff.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: denylist
        name: nomes de clientes
        entry: python scripts/check_denylist.py
        language: system
        pass_filenames: true

      # teste golden do adaptador Excel (plano 1.5; metodologia-core seccao 15):
      # so corre quando o commit toca no adaptador, na fixture ou no proprio teste.
      # Sem LibreOffice sai com 2 e bloqueia o commit -- instalar, nunca --no-verify.
      - id: golden
        name: golden do adaptador Excel
        entry: python scripts/golden_check.py
        language: system
        pass_filenames: false
        files: ^(adapters/|tests/golden/|docs/tecnica-excel\.md$|scripts/golden_check\.py$)

      # testes unitarios (adaptador, painel, denylist): rapidos, sem LibreOffice
      - id: testes
        name: testes unitarios
        entry: python -m unittest discover -s tests
        language: system
        pass_filenames: false
        files: ^(adapters/|scripts/|tests/)
