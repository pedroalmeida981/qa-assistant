# pre-commit install installs both kinds of hook: the file hooks (pre-commit) and the message one
# (commit-msg). Hooks without "stages" run only at pre-commit (default_stages), not again on the message.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # detect-secrets 1.5.0 opens files with open() without an encoding: on Windows (cp1252)
  # a UTF-8 file with certain characters (e.g. "Á" = bytes C3 81) raises UnicodeDecodeError
  # and is SKIPPED silently, as if it were binary. It runs in UTF-8 mode (-X utf8), like
  # the CI's Linux. Same id: the CI calls `pre-commit run detect-secrets`.
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        language: python
        additional_dependencies: ['detect-secrets==1.5.0']
        entry: python -X utf8 -m detect_secrets.pre_commit_hook
        args: ['--baseline', '.secrets.baseline']

  # lint as in the CI (.github/workflows/ci.yml): same version, same ruff.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: denylist
        name: client names
        entry: python scripts/check_denylist.py
        language: system
        pass_filenames: true

      # the commit message also stays in the history: a client name in a message got through once
      # (25.09.2026), because the hook above only reads files
      - id: denylist-message
        name: client names in the commit message
        entry: python scripts/check_denylist.py
        language: system
        stages: [commit-msg]

      # golden test of the Excel adapter (plan 1.5; methodology section 15):
      # runs only when the commit touches the adapter, the fixture or the test itself.
      # Without LibreOffice it exits with 2 and blocks the commit -- install it, never --no-verify.
      - id: golden
        name: Excel adapter golden
        entry: python scripts/golden_check.py
        language: system
        pass_filenames: false
        files: ^(adapters/|tests/golden/|docs/technique-excel\.md$|scripts/golden_check\.py$|scripts/migrate_workspace\.py$)

      # unit tests: fast, no LibreOffice. They also run when the files the tests read change:
      # skills and CLAUDE.md (test_skills), demo (test_validate_project, test_dashboard), project.yaml
      # template and this configuration (test_guards); the qa-audit engine (src/, pyproject.toml, .gitignore and
      # LICENSE: tests/unit/test_engine_guards.py); the documents (test_language)
      - id: tests
        name: unit tests
        entry: python -m unittest discover -s tests
        language: system
        pass_filenames: false
        files: ^(adapters/|qa_ui/|scripts/|src/|tests/|examples/|integrations/|docs/|\.claude/skills/|CLAUDE\.md$|README\.md$|CONTRIBUTING\.md$|CHANGELOG\.md$|\.github/|\.pre-commit-config\.yaml$|pyproject\.toml$|\.gitignore$|LICENSE$)
