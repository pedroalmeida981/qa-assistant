repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: denylist
        name: nomes de clientes
        entry: python scripts/check_denylist.py
        language: system
        pass_filenames: true
