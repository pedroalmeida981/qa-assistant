[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-audit"
version = "0.1.0"
description = "Automated QA audit engine of the qa-assistant framework (docs/qa-audit.md)"
readme = "docs/qa-audit.md"
requires-python = ">=3.12"
license = { text = "Proprietary. All rights reserved. See LICENSE." }
# never published: PyPI rejects packages with this classifier
classifiers = ["Private :: Do Not Upload"]
# exact versions (plan 7.5): an update is its own change, with the tests passing
dependencies = [
    "playwright==1.63.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
visual = ["pillow==12.3.0"]
dev = ["ruff==0.16.8"]

[project.scripts]
qa-audit = "qa_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa_audit = ["modules/*/config.yaml", "modules/*/README.md", "modules/*/vendor/*", "reports/templates/*"]
