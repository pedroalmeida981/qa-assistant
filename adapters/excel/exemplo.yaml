# Configuracao FICTICIA do adaptador Excel (adapters/excel/base.py).
# Serve de exemplo e de base ao teste golden (plano, tarefa 1.4).
# Nenhum dado real: sheets, colunas, estados e IDs sao inventados.
# Num projeto real esta secao vive no projeto.yaml do workspace (chave `excel:`).

ficheiro: "plano-exemplo.xlsx"

casos:
  sheets:                      # prefixo do ID do caso -> sheet onde vive
    "CT-LOJA-": "Loja"
    "CT-CONTA-": "Conta"
    "CT-ADMIN-": "Admin"
  linha_cabecalho: 1
  colunas:
    id: "ID"
    estado: "Status"
    resultado_obtido: "Actual Result"   # opcional
    observacoes: "Notes"                # opcional
  estados: ["To Do", "Pass", "Fail", "Blocked", "N/A"]

defeitos:
  sheet: "Defects"
  linha_cabecalho: 1
  formato_id: "BUG-{n}"
  colunas:
    id: "Key"
    estado: "Status"
    caso: "Test Case"
    severidade: "Severity"
    prioridade: "Priority"
    reportado_por: "Reporter"
    data_report: "Created"
  campos_lote:                 # chave do defeito no lote -> coluna
    titulo: "Summary"
    descricao: "Description"
    area: "Component"
  valores_omissao: {}
  estados: ["New", "In Progress", "Resolved", "Won't Fix"]
  estados_fechados: ["Resolved", "Won't Fix"]
  estado_inicial: "New"
  prioridades: ["P1", "P2", "P3", "P4"]

vista_ativos:
  sheet: "Open Defects"
  linha_cabecalho: 3
  colunas:                     # cabecalho da vista -> coluna dos defeitos
    "Bug": "Key"
    "Prio": "Priority"
    "Sev": "Severity"
    "Title": "Summary"
    "Case": "Test Case"
  ordenar_por: "Component"
  resumo:
    celula: "A2"
    modelo: "{abertos} open ({severidade[High]} High, {severidade[Medium]} Medium, {severidade[Low]} Low) - {fechados} closed - updated {data:%Y-%m-%d}"

notas:
  resultado: "Actual: {resultado}"
  defeito_novo: "New defect: {id}."

controlo_lotes:
  sheet: "_qa_lotes"

recalc:
  mecanismo: "libreoffice"     # ou "excel-com" (so Windows com Excel)
  timeout: 60
