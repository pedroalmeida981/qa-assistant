# CT-MOB-001 · Login com credenciais válidas (tecnica-mobile.md; Maestro Web, beta)
# Credenciais: MAESTRO_<VAR> no ambiente, postas pelo scripts/testar_mobile.py a partir do .env.
url: https://www.saucedemo.com
---
- launchApp
- tapOn:
    id: "user-name"
- inputText: ${MAESTRO_DEMO_SAUCE_STANDARD_USER}
- tapOn:
    id: "password"
- inputText: ${MAESTRO_DEMO_SAUCE_PASSWORD}
- tapOn:
    id: "login-button"
- assertVisible: "Products"
