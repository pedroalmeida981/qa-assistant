# TC-MOB-002 · Login of a locked out user (technique-mobile.md; Maestro Web, beta)
url: https://www.saucedemo.com
---
- launchApp
- tapOn:
    id: "user-name"
- inputText: ${MAESTRO_DEMO_SAUCE_LOCKED_OUT_USER}
- tapOn:
    id: "password"
- inputText: ${MAESTRO_DEMO_SAUCE_PASSWORD}
- tapOn:
    id: "login-button"
- assertVisible: "Epic sadface: Sorry, this user has been locked out."
