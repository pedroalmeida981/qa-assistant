projeto: "demo-saucedemo"
empresa: "demo"               # workspace de demonstracao dentro do qa-assistant (examples/demo)
ambientes:
  teste: "https://www.saucedemo.com/"   # site publico de pratica; nao ha producao
  api-teste: "https://restful-booker.herokuapp.com"   # API publica de pratica (modulo api); nao ha producao
roles:
  - standard_user
  - locked_out_user
  - problem_user
  - performance_glitch_user
  - error_user
  - visual_user
tracker: "excel"             # azure-devops | jira | excel
formato_bug: "BUG-{n}"       # campos = colunas da sheet Defeitos
bugs_resolvidos: "remover"   # ou "arquivar"
evidencia: "texto"           # ou "texto+screenshot"
modulos: [funcional-web, exploratorio, api, acessibilidade, mobile]
registo_leve: "runs/"        # pasta do registo leve da sessao (nunca historico/, que e imutavel)

api:                         # modulo api (docs/tecnica-api.md, plano 3.1)
  base_url: "https://restful-booker.herokuapp.com"
  contrato: "https://restful-booker.herokuapp.com/apidoc/index.html"   # documentacao publicada: fonte do esperado
  autenticacao: "cookie"       # token de POST /auth no cookie token=...; a doc tambem aceita Basic
  credenciais:
    admin: {var_utilizador: DEMO_BOOKER_USER, var_palavra_passe: DEMO_BOOKER_PASSWORD}

acessibilidade:               # modulo acessibilidade (docs/tecnica-acessibilidade.md, plano 3.2)
  norma: "WCAG 2.1 AA"
  browser: "chromium"         # browser do motor qa-audit (qa-audit doctor)
  auditar_paginas_com_erro_http: true  # o saucedemo responde 404 aos links diretos das paginas com login (SPA)
  login:                      # formulario de login antes das paginas com login: true
    url: "https://www.saucedemo.com/"
    campo_utilizador: "#user-name"
    campo_palavra_passe: "#password"
    botao: "#login-button"
    var_utilizador: DEMO_SAUCE_STANDARD_USER
    var_palavra_passe: DEMO_SAUCE_PASSWORD
  paginas:
    - {nome: login, url: "https://www.saucedemo.com/", login: false}
    - {nome: produtos, url: "https://www.saucedemo.com/inventory.html", login: true}
    - {nome: carrinho, url: "https://www.saucedemo.com/cart.html", login: true}
    - {nome: checkout-dados, url: "https://www.saucedemo.com/checkout-step-one.html", login: true}

mobile:                       # modulo mobile (docs/tecnica-mobile.md, plano 3.3)
  plataforma: "web"           # Maestro Web (beta): nao ha dispositivo/emulador nesta maquina
  flows: "flows"              # um flow por caso: CT-MOB-<n>_<nome>.yaml
  variaveis: [DEMO_SAUCE_STANDARD_USER, DEMO_SAUCE_LOCKED_OUT_USER, DEMO_SAUCE_PASSWORD]

painel:                      # significado de cada estado de caso no painel (plano 5.1)
  estados: {"Por testar": pendente, "Pass": ok, "Fail": falha, "Blocked": bloqueado, "N/A": na}

# ---------------------------------------------------------------------------
# excel: layout do workbook, lido pelo adaptador (adapters/excel/base.py).
# Preenchido no onboarding de 23.09.2026 com `python -m adapters.excel.inspecionar`
# + respostas do utilizador. Campos comentados no template docs/projeto.yaml.
# ---------------------------------------------------------------------------
excel:
  ficheiro: "workbook/plano-demo.xlsx"

  casos:
    sheets:
      "CT-LOGIN-": "Login"
      "CT-PROD-": "Produtos"
      "CT-CHK-": "Checkout"
      "CT-API-": "API"
      "CT-A11Y-": "Acessibilidade"
      "CT-MOB-": "Mobile"
    linha_cabecalho: 1
    colunas:
      id: "ID"
      estado: "Estado"
      resultado_obtido: "Resultado Obtido"
      observacoes: "Observações"
    estados: ["Por testar", "Pass", "Fail", "Blocked", "N/A"]

  defeitos:
    sheet: "Defeitos"
    linha_cabecalho: 1
    formato_id: "BUG-{n}"
    colunas:
      id: "ID"
      estado: "Estado"
      caso: "Caso"
      severidade: "Severidade"
      prioridade: "Prioridade"
      reportado_por: "Reportado por"
      data_report: "Data"
    campos_lote:
      titulo: "Título"
      descricao: "Descrição"
      area: "Área"
      role: "Role"
    valores_omissao: {}
    estados: ["Aberto", "Em análise", "Em correção", "Corrigido", "Reaberto", "Fechado", "Não é defeito"]
    estados_fechados: ["Corrigido", "Fechado", "Não é defeito"]
    estado_inicial: "Aberto"
    prioridades: ["Crítica", "Alta", "Média", "Baixa"]

  aba_resumo:                  # verificado contra a contagem direta (tecnica-excel.md secao 5)
    sheet: "Resumo"
    linha_cabecalho: 3
    coluna_area: "Área"
    coluna_total: "Total"
    linha_total: "Total"
    coluna_percentagem: "% Executado"
    estado_por_testar: "Por testar"

  vista_ativos:
    sheet: "Defeitos Ativos"
    linha_cabecalho: 3
    colunas: {}                # cabecalhos iguais aos da sheet Defeitos
    ordenar_por: "Área"
    resumo:
      celula: "A2"
      modelo: "{abertos} abertos ({severidade[Crítica]} Crítica, {severidade[Alta]} Alta, {severidade[Média]} Média, {severidade[Baixa]} Baixa) · {fechados} fechados · atualizado a {data:%d.%m.%Y}"

  notas:
    resultado: "Resultado: {resultado}"
    defeito_novo: "Defeito novo: {id}."

  controlo_lotes:
    sheet: "_qa_lotes"

  recalc:
    mecanismo: "libreoffice"
    timeout: 60
