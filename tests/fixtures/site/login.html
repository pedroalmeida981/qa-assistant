<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in — Fictional Shop account</title></head>
<body><main><h1>Sign in to your account</h1>
<form id="login" method="post" action="/login">
  <label for="user">User name</label> <input id="user" name="user" type="text" autocomplete="username">
  <label for="pass">Password</label> <input id="pass" name="pass" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form></main></body>
</html>
