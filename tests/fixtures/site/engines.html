<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Engines — Fictional Shop</title>

<body>
<main><h1>Engine-specific page</h1>
<p>Planted (docs/qa-audit.md §21): in Firefox only, a script adds an image without alternative text, so a
compatibility run finds exactly one difference here. No link points to this page.</p>
<div id="slot"></div>
<script>
if (navigator.userAgent.includes("Firefox")) {
  var img = document.createElement("img");
  img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
  img.width = 20; img.height = 20; img.id = "firefox-only";
  document.getElementById("slot").appendChild(img);
}
</script>
</main>
</body>
</html>
