# CI da framework (plano 4.1): lint, testes unitarios, segredos e teste golden em cada push.
# A denylist pessoal nao corre aqui de proposito -- vive so no pre-commit local.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check --output-format github .

  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # extra do motor visual (Pillow): sem ele os testes de comparacao de imagens ficariam skipped
      - run: pip install pillow==12.3.0
      - run: python -m unittest discover -s tests -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # so o hook detect-secrets do .pre-commit-config.yaml (mesma versao e baseline)
      - run: pre-commit run detect-secrets --all-files --show-diff-on-failure

  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar LibreOffice (recalculo do golden)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
      - run: pip install -r requirements.txt
      - run: python scripts/golden_check.py
      # testes que recalculam formulas reais (resumo vs contagem direta), a reconstrucao do demo
      # (workbook versionado = gerador + lotes; plano 7.6) e o mecanismo do golden real com dados
      # ficticios (plano 7.3); no job testes ficam skipped
      - run: python -m unittest tests.test_resumo tests.test_demo_reproduzivel tests.test_golden_real -v

  qa-audit:
    # motor qa-audit (plano 8.2): testes de integracao contra o site local, nos tres engines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[visual]
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: qa-audit doctor --no-color
      # xvfb: o metodo de login manual abre o browser visivel (docs/qa-audit.md 20)
      - run: sudo apt-get install -y -q xvfb
      - run: xvfb-run -a python -m unittest discover -s tests/integration -v
        env:
          QA_AUDIT_TEST_ENGINES: chromium,firefox,webkit
          QA_AUDIT_REQUIRE_ENGINES: "1"

  install:
    # plano 8.9: checkout limpo -> scripts/install.sh -> auditoria ao site local de fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: ./scripts/install.sh --with-deps
      - name: auditoria ao site local (codigo 1 esperado pelos defeitos plantados)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures/site > /dev/null 2>&1 &
          sleep 2
          set +e
          .venv/bin/qa-audit http://127.0.0.1:8765/ --max-pages 8 --delay-ms 0 --no-color             --output "$RUNNER_TEMP/out" --baseline-dir "$RUNNER_TEMP/baselines"
          code=$?
          set -e
          echo "qa-audit exit code: $code"
          test "$code" = 1
          ls "$RUNNER_TEMP"/out/*/report.html "$RUNNER_TEMP"/out/*/results.json

  demo-e2e:
    # regressao N2 do demo contra o site publico (plano 4.2; specs em examples/demo/e2e)
    runs-on: ubuntu-24.04
    env:
      DEMO_SAUCE_STANDARD_USER: ${{ secrets.DEMO_SAUCE_STANDARD_USER }}
      DEMO_SAUCE_LOCKED_OUT_USER: ${{ secrets.DEMO_SAUCE_LOCKED_OUT_USER }}
      DEMO_SAUCE_PASSWORD: ${{ secrets.DEMO_SAUCE_PASSWORD }}
    defaults:
      run:
        working-directory: examples/demo/e2e
    steps:
      - uses: actions/checkout@v5
      - name: Secrets do demo presentes?
        id: segredos
        run: |
          if [ -z "$DEMO_SAUCE_PASSWORD" ] || [ -z "$DEMO_SAUCE_STANDARD_USER" ] || [ -z "$DEMO_SAUCE_LOCKED_OUT_USER" ]; then
            echo "::warning title=demo-e2e nao correu::secrets DEMO_SAUCE_* em falta no repositorio (Settings > Secrets and variables > Actions)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.segredos.outputs.ok == 'true'
        with:
          node-version: "22"
      - if: steps.segredos.outputs.ok == 'true'
        run: npm ci
      - if: steps.segredos.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      # motor qa-audit para a auditoria de estados (docs/qa-audit.md seccao 22): liga-se ao Chromium das specs
      # por CDP, por isso so precisa do pacote, nao dos browsers do Playwright para Python
      - uses: actions/setup-python@v6
        if: steps.segredos.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - if: steps.segredos.outputs.ok == 'true'
        working-directory: .
        run: pip install -e .
      - if: steps.segredos.outputs.ok == 'true'
        env:
          QA_AUDIT_CDP_PORT: "9222"
        run: npx playwright test
