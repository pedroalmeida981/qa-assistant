# CI da framework (plano 4.1): lint, testes unitarios, segredos e teste golden em cada push.
# A denylist pessoal nao corre aqui de proposito -- vive so no pre-commit local.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check --output-format github .

  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # so o hook detect-secrets do .pre-commit-config.yaml (mesma versao e baseline)
      - run: pre-commit run detect-secrets --all-files --show-diff-on-failure

  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar LibreOffice (recalculo do golden)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
      - run: pip install -r requirements.txt
      - run: python scripts/golden_check.py
      # testes que recalculam formulas reais (resumo vs contagem direta) e a reconstrucao do demo
      # (workbook versionado = gerador + lotes; plano 7.6); no job testes ficam skipped
      - run: python -m unittest tests.test_resumo tests.test_demo_reproduzivel -v

  demo-e2e:
    # regressao N2 do demo contra o site publico (plano 4.2; specs em examples/demo/e2e)
    runs-on: ubuntu-24.04
    env:
      DEMO_SAUCE_STANDARD_USER: ${{ secrets.DEMO_SAUCE_STANDARD_USER }}
      DEMO_SAUCE_LOCKED_OUT_USER: ${{ secrets.DEMO_SAUCE_LOCKED_OUT_USER }}
      DEMO_SAUCE_PASSWORD: ${{ secrets.DEMO_SAUCE_PASSWORD }}
    defaults:
      run:
        working-directory: examples/demo/e2e
    steps:
      - uses: actions/checkout@v5
      - name: Secrets do demo presentes?
        id: segredos
        run: |
          if [ -z "$DEMO_SAUCE_PASSWORD" ] || [ -z "$DEMO_SAUCE_STANDARD_USER" ] || [ -z "$DEMO_SAUCE_LOCKED_OUT_USER" ]; then
            echo "::warning title=demo-e2e nao correu::secrets DEMO_SAUCE_* em falta no repositorio (Settings > Secrets and variables > Actions)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.segredos.outputs.ok == 'true'
        with:
          node-version: "22"
      - if: steps.segredos.outputs.ok == 'true'
        run: npm ci
      - if: steps.segredos.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.segredos.outputs.ok == 'true'
        run: npx playwright test
